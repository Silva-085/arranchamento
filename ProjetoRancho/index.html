<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Refeições - 2º GAC L</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="logo">
        <img src="img/2_GAC.png" alt="Logo 2º GAC L">
    </div>

    <h2>Arranchamento</h2>

    <form id="formRefeicao">
        <div class="row">
            <div class="input-group">
                <label>Nome de Guerra</label>
                <div class="input-wrapper">
                    <i class="icon">👤</i>
                    <input type="text" id="nome" placeholder="Ex: Silva" required>
                </div>
            </div>
            <div class="input-group">
                <label>Número</label>
                <div class="input-wrapper">
                    <i class="icon">🆔</i>
                    <input type="number" id="numero" placeholder="Ex: 123" required>
                </div>
            </div>
        </div>

        <label class="section-label">Bateria</label>
        <div class="grid-baterias">
            <label class="card-radio"><input type="radio" name="bateria" value="BC" required><span>🦁 BC</span></label>
            <label class="card-radio"><input type="radio" name="bateria" value="1BO"><span>🦅 1ª BO</span></label>
            <label class="card-radio"><input type="radio" name="bateria" value="2BO"><span>💀 2ª BO</span></label>
            <label class="card-radio"><input type="radio" name="bateria" value="3BM"><span>🐆 3ª BM</span></label>
        </div>

        <label class="section-label">Dias (Múltipla Escolha)</label>
        <div class="grid-dias">
            <label class="card-check"><input type="checkbox" value="Seg"><span>Seg</span></label>
            <label class="card-check"><input type="checkbox" value="Ter"><span>Ter</span></label>
            <label class="card-check"><input type="checkbox" value="Qua"><span>Qua</span></label>
            <label class="card-check"><input type="checkbox" value="Qui"><span>Qui</span></label>
            <label class="card-check"><input type="checkbox" value="Sex"><span>Sex</span></label>
            <label class="card-check"><input type="checkbox" value="Sáb"><span>Sáb</span></label>
            <label class="card-check"><input type="checkbox" value="Dom"><span>Dom</span></label>
        </div>

        <label class="section-label">Refeição</label>
        <div class="grid-refeicoes">
            <label class="card-check"><input type="checkbox" value="cafe"><span>☕ Café</span></label>
            <label class="card-check"><input type="checkbox" value="almoco"><span>🍽️ Almoço</span></label>
            <label class="card-check"><input type="checkbox" value="janta"><span>🥣 Janta</span></label>
        </div>

        <button type="submit">Registrar Arranchamento</button>
    </form>

    <div class="footer">Sistema Interno - 2° GAC Regimento Deodoro </div>
</div>

<script src="script.js"></script>

<footer style="margin-top: 30px; text-align: center;">
    <a href="visualizar.html" style="color: transparent; text-decoration: none; font-size: 10px;">.</a>
</footer>
    </p>
</footer>
</body>
</html>
